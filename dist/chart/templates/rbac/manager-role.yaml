apiVersion: rbac.authorization.k8s.io/v1
{{- if .Values.rbac.namespaced }}
kind: Role
{{- else }}
kind: ClusterRole
{{- end }}
metadata:
{{- if .Values.rbac.namespaced }}
{{- end }}
  name: {{ include ( printf "%s.%s" .Chart.Name "resourceName" ) (dict "suffix" "manager-role" "context" $) }}
rules:
- apiGroups:
  - dashboard.netztronaut.de
  resources:
  - bookmarkgroups
  - bookmarks
  - infotiles
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - dashboard.netztronaut.de
  resources:
  - bookmarkgroups/finalizers
  - bookmarks/finalizers
  - infotiles/finalizers
  verbs:
  - update
- apiGroups:
  - dashboard.netztronaut.de
  resources:
  - bookmarkgroups/status
  - bookmarks/status
  - infotiles/status
  verbs:
  - get
  - patch
  - update
