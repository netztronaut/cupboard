{{- if eq (include ( printf "%s.%s" .Chart.Name "managerEnabled" ) .) "true" }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  labels:
    {{- include ( printf "%s.%s" .Chart.Name "labels" ) . | nindent 4 }}
  name: {{ include ( printf "%s.%s" .Chart.Name "resourceName" ) (dict "suffix" "manager-viewer-clusterrolebinding" "context" $) }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include ( printf "%s.%s" .Chart.Name "resourceName" ) (dict "suffix" "manager-viewer-role" "context" $) }}
subjects:
- kind: ServiceAccount
  name: {{ include ( printf "%s.%s" .Chart.Name "serviceAccountName" ) . }}
  namespace: {{ .Release.Namespace }}
{{- end }}
